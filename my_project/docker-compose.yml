version: '3.8'

services:
  db:
    image: postgres:15 # или ваша версия
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - pg_data:/var/lib/postgresql/data # Именованный том для сохранения данных БД
    ports:
      - "5432:5432"

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app # Bind mount: привязываем текущую папку на хосте к папке /app в контейнере
    environment:
      - DATABASE_URL=postgres://myuser:mypassword@db:5432/mydb
    depends_on:
      - db

volumes:
  pg_data: # Объявление именованного тома на корневом уровне
